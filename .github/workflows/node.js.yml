name: Node.js Full CI

on:
  push:
    branches: ["main"] # Trigger on push to main
  pull_request:
    branches: ["main"] # Trigger on PR targeting main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpassword
    strategy:
      matrix:
        node-version: [24.x] # Test multiple Node versions

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # 3. Install backend dependencies
      - name: Install backend dependencies
        run: npm install

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm install --prefix client

      # 5. Build frontend, and prepare public folder
      - name: Build frontend, and prepare public folder
        run: npm run deploy:build

      # Start MySQL service
      - name: Start MySQL service
        run: sudo service mysql start

      # Create test database and user
      - name: Create test database and user
        run: |
          mysql -e "CREATE DATABASE testdb;"
          mysql -e "CREATE USER 'testuser'@'localhost' IDENTIFIED BY 'testpassword';"
          mysql -e "GRANT ALL PRIVILEGES ON testdb.* TO 'testuser'@'localhost';"
          mysql -e "FLUSH PRIVILEGES;"

      # 6. Build api documentation
      - name: Build API documentation
        run: npm run apidoc

      # 7. Run tests
      - name: Run backend tests
        run: npm run test
      #- name: Run frontend tests
      #  run: npm test --prefix client
