name: Node.js Full CI

on:
  push:
    branches: ["main"] # Trigger on push to main
  pull_request:
    branches: ["main"] # Trigger on PR targeting main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x] # Test multiple Node versions

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # Cache all dependencies
          cache-dependency-path: package-lock.json,client/package-lock.json

      # 3. Install backend dependencies
      - name: Install backend dependencies
        run: npm ci

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci --prefix client

      # 5. Build frontend, Add Api documentation and copy to public folder
      - name: Build frontend, generate API docs, and prepare public folder
        run: npm run deploy:build

      # 6. Run tests
      # - name: Run Apitests
      #   run: npm run api-test
      #- name: Run backend tests
      #  run: npm test
      #- name: Run frontend tests
      #  run: npm test --prefix client
